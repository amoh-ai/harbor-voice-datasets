# Generated by eva_adapter.main. Harbor supplies main; this adds the eva
# service: EVA's own code for prompts, tools, validation and grading.
services:
  main:
    depends_on:
      eva:
        condition: service_healthy
    # Not every backend passes the task's env to main (harbor's EC2 does
    # not), so main names what it needs, as the eva service does.
    environment:
      - OPENAI_API_KEY
      - ELEVENLABS_API_KEY
      - EVA_EN_USER_F
      - EVA_EN_USER_M
    volumes:
      # Wheels' dependencies survive across trials.
      - ${HARBOR_VOICE_CACHE_DIR:-${HOME}/.cache/harbor-voice}/uv:/root/.cache/uv
  eva:
    image: ghcr.io/amoh-ai/eva-sidecar:039efa0a-21e9a0b06c@sha256:6de7f4ff116baf7ddac7bdc7ae190b19a90987d1d1ecb45d9b59699d51ecc206
    environment:
      - OPENAI_API_KEY
      - EVA_MODEL_LIST
      - GEMINI_API_KEY
      - GOOGLE_API_KEY
      - GOOGLE_APPLICATION_CREDENTIALS
      - VERTEXAI_PROJECT
      - VERTEXAI_LOCATION
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - AWS_REGION
      - JUDGE_MODEL
      - EVA_SIDECAR_METRIC_CONFIGS
      - AWS_REGION_NAME=${AWS_REGION:-}
