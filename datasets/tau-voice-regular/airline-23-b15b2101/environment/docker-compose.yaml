# Generated by tau_voice.main. Harbor supplies main; this adds the tau2
# service: tools, prompts, the caller's LLM, grading.
services:
  main:
    depends_on:
      tau2:
        condition: service_healthy
    # Not every backend passes the task's env to main (harbor's EC2 does
    # not), so main names what it needs, as the tau2 service does.
    environment:
      - OPENAI_API_KEY
      - ELEVENLABS_API_KEY
      - HARBOR_VOICE_TTS_CACHE
    volumes:
      # Caller audio and wheels' dependencies survive across trials.
      - ${HARBOR_VOICE_CACHE_DIR:-${HOME}/.cache/harbor-voice}/tts:/cache/tts
      - ${HARBOR_VOICE_CACHE_DIR:-${HOME}/.cache/harbor-voice}/uv:/root/.cache/uv
  tau2:
    image: ghcr.io/amoh-ai/tau-voice-runtime:2174a60-3cefc407ea@sha256:5a911d83705c44805f342a86045c8380fcbf515d0703d7dba4b48d0529087253
    environment:
      - OPENAI_API_KEY
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_REGION
      - TAU2_VOICE_ID_MATT_DELANEY
      - TAU2_VOICE_ID_LISA_BRENNER
      - TAU2_VOICE_ID_MILDRED_KAPLAN
      - TAU2_VOICE_ID_ARJUN_ROY
      - TAU2_VOICE_ID_WEI_LIN
      - TAU2_VOICE_ID_MAMADOU_DIALLO
      - TAU2_VOICE_ID_PRIYA_PATIL
      - AWS_REGION_NAME=${AWS_REGION}
      - TAU_VOICE_REVIEW_MODEL=${TAU_VOICE_REVIEW_MODEL:-bedrock/us.anthropic.claude-opus-4-5-20251101-v1:0}
